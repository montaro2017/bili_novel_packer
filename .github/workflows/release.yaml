name: Build & Release

# Trigger when a version tag is pushed, or manually
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        target: [Windows, Linux, MacOS]
        edition: [cli, tui]
        include:
          - target: Windows
            os: windows-latest
            artifact_name: release-Windows
            artifact_path: ./*-windows.exe
          - target: Linux
            os: ubuntu-latest
            artifact_name: release-Linux
            artifact_path: ./*-linux
          - target: MacOS
            os: macos-latest
            artifact_name: release-MacOS
            artifact_path: ./*-macos
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      date: ${{ steps.get_version.outputs.date}}
    runs-on: ${{ matrix.os }}
    env:
      FLUTTER_VERSION: 3.44.3
    steps:
      # Checkout branch
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Flutter Pub Get
      - name: Flutter Pub Get
        run: |
          git config --global core.longpaths true
          flutter doctor -v
          flutter pub get

      # Get app version
      - name: Get app version
        id: get_version
        shell: bash
        run: |
          echo "version=$(head -n 3 pubspec.yaml | tail -n 1 | cut -d ' ' -f 2)" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      # Build MacOS
      - name: Build MacOS
        if: matrix.target == 'MacOS'
        run: |
          dart compile exe bin/${{ matrix.edition }}.dart -o ./bili_novel_packer-${{ steps.get_version.outputs.version }}-${{ matrix.edition }}-arm64-macos

      # Build Windows
      - name: Build Windows
        if: matrix.target == 'Windows'
        run: |
          dart compile exe bin/${{ matrix.edition }}.dart -o ./bili_novel_packer-${{ steps.get_version.outputs.version }}-${{ matrix.edition }}-x86_64-windows.exe

      # Build Linux
      - name: Build Linux
        if: matrix.target == 'Linux'
        run: |
          dart compile exe --target-os=linux --target-arch=x64 --output=./bili_novel_packer-${{ steps.get_version.outputs.version }}-${{ matrix.edition }}-x86_64-linux ./bin/${{ matrix.edition }}.dart
          dart compile exe --target-os=linux --target-arch=arm64 --output=./bili_novel_packer-${{ steps.get_version.outputs.version }}-${{ matrix.edition }}-arm64-linux ./bin/${{ matrix.edition }}.dart
          dart compile exe --target-os=linux --target-arch=riscv64 --output=./bili_novel_packer-${{ steps.get_version.outputs.version }}-${{ matrix.edition }}-riscv64-linux ./bin/${{ matrix.edition }}.dart

      # Upload Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ matrix.edition }}
          path: ${{ matrix.artifact_path }}

  Publish:
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        shell: bash
        run: |
          current_tag="$GITHUB_REF_NAME"
          previous_tag="$(git describe --tags --abbrev=0 --match 'v*' "${current_tag}^" 2>/dev/null || true)"
          {
            echo "## 更新内容"
            echo
            if [ -n "$previous_tag" ]; then
              git log "${previous_tag}..${current_tag}" --no-merges --pretty=format:'- %s (%h)'
              printf '\n\n**完整变更**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous_tag" "$current_tag"
            else
              git log "$current_tag" --no-merges --pretty=format:'- %s (%h)'
              printf '\n'
            fi
          } > release-notes.md
      - name: Download all Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: /tmp/artifacts/final
          merge-multiple: true

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          allowUpdates: true
          generateReleaseNotes: false
          bodyFile: release-notes.md
          artifacts: /tmp/artifacts/final/*
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          prerelease: true

      - name: Prepare Gitee release notes
        id: gitee_notes
        shell: python
        run: |
          import os
          import uuid
          from pathlib import Path

          body = Path("release-notes.md").read_text(encoding="utf-8")
          delimiter = uuid.uuid4().hex
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"body<<{delimiter}\n{body}\n{delimiter}\n")

      - name: Publish to Gitee
        uses: nicennnnnnnlee/action-gitee-release@master
        with:
          gitee_action: create_release
          gitee_owner: Montaro2017
          gitee_repo: bili_novel_packer
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ github.ref_name }}
          gitee_release_name: ${{ github.ref_name }}
          gitee_release_body: ${{ steps.gitee_notes.outputs.body }}
          gitee_target_commitish: master
          gitee_upload_retry_times: 3
          gitee_files: /tmp/artifacts/final/*
